# Magonote Configuration Example
# Copy this file to ~/.config/magonote/config.toml or specify with --config

[core]
# Sets the alphabet used for generating hints
alphabet = "qwerty"

# Output format for the picked hint. Placeholders:
#   %H text  %G group  %K kind  %P path  %L line  %C column  %U uppercase flag
# Use "json" for the structured protocol the tmux adapter consumes.
format = "%H"

# Hint position: "left", "right", "off_left", or "off_right"
position = "left"

# Enable multi-selection mode
multi = false

# Reverse the order for assigned hints
reverse = false

# Unique level: 0 = none, 1 = unique hints, 2 = highlight only one duplicate
unique_level = 0

# Put square brackets around hint for visibility
contrast = false

[rules]
# Enable low-priority candidates for every word (default: false)
words = false

# User-defined matching and filtering rules

[rules.include]
# Additional rules to match. Only { type = "regex" } is honored here.
rules = [
    # { type = "regex", pattern = "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b" },  # Email
    # { type = "regex", pattern = "\\bhttps?://[\\w.-]+\\b" },                                 # URL
]

[rules.exclude]
# Exclusion rules to filter out unwanted matches by defining regions in the original text
# The rules first identify exclusion regions in the input text, then filter out any matches
# whose coordinates overlap with these regions
rules = [
    # Example: Exclude entire shell prompt lines
    # { type = "regex", pattern = "^user@hostname:.*\\$ " },  # Lines starting with prompt
    # { type = "text", pattern = "~/project$ " },             # Specific prompt fragment

    # Additional examples:
    # { type = "text", pattern = "DEBUG" },                   # Regions containing "DEBUG"
    # { type = "regex", pattern = "^\\[.*\\]\\$ " },         # Bracketed prompts like "[user@host]$ "
    # { type = "regex", pattern = "^\\d{4}-\\d{2}-\\d{2}" }, # Lines starting with dates
    # { type = "regex", pattern = "Error:.*" },              # Entire error message lines

    # Exclude log timestamps and noise:
    # { type = "regex", pattern = "^\\d{2}:\\d{2}:\\d{2}" }, # Timestamps like 12:34:56
    # { type = "text", pattern = "INFO" },                   # Any region containing INFO logs
]

[colors.match]
# Foreground color for matches
foreground = "green"
# Background color for matches
background = "black"

[colors.hint]
# Foreground color for hints
foreground = "yellow"
# Background color for hints
background = "black"

[colors.multi]
# Foreground color for multi selected items
foreground = "yellow"
# Background color for multi selected items
background = "black"

[colors.select]
# Foreground color for selection
foreground = "blue"
# Background color for selection
background = "black"

[plugins.tabledetection]
enabled = true
min_lines = 3
min_columns = 3
confidence_threshold = 0.8

[plugins.colordetection]
enabled = true

[plugins.profiles]
enabled = true
exclude_prompt = true
# Additional prompt regexes; each must contain a named `cmd` capture group.
prompt_patterns = []

# ---------------------------------------------------------------------------
# Action groups
# ---------------------------------------------------------------------------
# A group binds a prefix key to kind-specific commands. A bare hint (no prefix)
# triggers the default group (key = ""), which copies. Press a group key, then a
# hint, to run that group's command for the selected entity's kind. Uppercase
# hints are a backward-compatible alias for the "open" group.
#
# Command values:
#   - a plain string is a background shell command (Run)
#   - { keys = "..." } sends keystrokes to the active pane (Keys); use <CR> for
#     Enter, plus <Esc>, <Tab>, <C-c>, etc.
#
# Template variables: {{.Text}} {{.Kind}} {{.Pane}} {{.Path}} {{.Line}}
#   {{.Column}} {{.LineArg}} ("+N " when a line number is known).
#   {{.TextSh}} / {{.PathSh}} are shell-escaped for safe use in pane commands.
#
# Group keys are reserved: they are excluded from the hint alphabet.
# The built-in defaults are platform-aware (e.g. `open` on macOS, `xdg-open`
# elsewhere); the entries below illustrate how to override or extend them.

[groups.copy]
key = ""
default = 'tmux set-buffer -- "{{.Text}}"'

[groups.open]
key = "o"
url      = 'xdg-open "{{.Text}}"'           # macOS: 'open "{{.Text}}"'
email    = 'xdg-open "mailto:{{.Text}}"'
path     = { keys = '${EDITOR:-vi} {{.LineArg}}{{.PathSh}}<CR>' }
filename = { keys = '${EDITOR:-vi} {{.LineArg}}{{.PathSh}}<CR>' }
sha      = { keys = 'git show {{.TextSh}}<CR>' }
branch   = { keys = 'git checkout {{.TextSh}}<CR>' }
default  = 'tmux set-buffer -- "{{.Text}}"'  # kinds without an open action

[groups.insert]
key = "i"
default = { keys = '{{.Text}}' }

# Example custom group: press 'l' then a hint to tail logs.
# [groups.logs]
# key = "l"
# "k8s.pod"          = { keys = 'kubectl logs {{.TextSh}}<CR>' }
# "docker.container" = { keys = 'docker logs {{.TextSh}}<CR>' }
